name: Deploy API Worker

# Manual only: the API and database change rarely, and deploying needs Cloudflare credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc -p worker/tsconfig.json
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Seed flavors (safe to re-run)
        run: pnpm exec wrangler d1 execute DB --remote --file=seed/seed.sql
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
